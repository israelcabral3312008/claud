<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SofáCRM — Demonstração</title>
<meta name="description" content="Demonstração do SofáCRM: CRM com assistente inteligente para loja de sofás. Dados fictícios.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F4F1;--card:#FFFFFF;--ink:#1E1B18;--muted:#7A726A;--line:#ECE7E1;--soft:#F3EEE9;
  --brand:#B8643A;--brand-d:#9A512C;--brand-l:#F4E4D8;
  --side:#1B1917;--side-ink:#CFC8C0;
  --green:#2E9E6A;--amber:#D99A2B;--red:#D2543F;--blue:#3C6FD1;--violet:#7B61D1;
  --shadow:0 1px 2px rgba(30,27,24,.04),0 4px 16px rgba(30,27,24,.06);
  --r:14px;
}
[data-theme="dark"]{
  --bg:#141210;--card:#1E1B19;--ink:#F2EEEA;--muted:#A39A91;--line:#2E2A26;--soft:#26221F;
  --brand-l:#3A271C;--side:#0E0D0C;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}

/* Sidebar */
.side{width:240px;background:var(--side);color:var(--side-ink);padding:22px 14px;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;gap:4px;z-index:20}
.logo{display:flex;align-items:center;gap:10px;padding:4px 10px 22px;color:#fff;font-weight:800;font-size:18px;letter-spacing:-.3px}
.logo .mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#D98A5B,var(--brand-d));display:grid;place-items:center}
.logo small{display:block;font-weight:500;font-size:11px;color:#8E857C;letter-spacing:0}
.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;cursor:pointer;border:0;background:none;width:100%;text-align:left;color:var(--side-ink);font-weight:500;transition:.15s}
.nav:hover{background:#2A2724;color:#fff}
.nav.active{background:var(--brand);color:#fff}
.nav svg{width:18px;height:18px;flex:none}
.nav .count{margin-left:auto;background:#ffffff22;font-size:11px;padding:1px 7px;border-radius:20px}
.side .spacer{flex:1}
.side .store{font-size:12px;padding:12px;border-radius:10px;background:#24211F;color:#9C948B}
.side .store b{color:#fff;display:block;font-size:13px}

/* Main */
.main{margin-left:240px;flex:1;min-width:0}
.top{display:flex;align-items:center;gap:12px;padding:18px 28px;position:sticky;top:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);z-index:10;border-bottom:1px solid var(--line)}
.top h1{font-size:20px;font-weight:700;letter-spacing:-.4px}
.top .sub{color:var(--muted);font-size:12.5px}
.top .grow{flex:1}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;width:280px}
.search input{border:0;outline:0;background:none;width:100%}
.content{padding:24px 28px 60px}

.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:600;font-size:13px;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-d);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn.wa{background:#25D366;border-color:#25D366;color:#fff}
.btn.wa:hover{background:#1EBE5A;color:#fff}
.btn.danger:hover{border-color:var(--red);color:var(--red)}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.icon-btn:hover{border-color:var(--brand);color:var(--brand)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 0;gap:10px}
.card-h h3{font-size:14.5px;font-weight:700}
.card-b{padding:16px 18px}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(5,1fr)}
.g2{grid-template-columns:1.6fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}

.kpi{padding:16px 18px}
.kpi .lbl{color:var(--muted);font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .val{font-size:24px;font-weight:800;letter-spacing:-.6px;margin:6px 0 4px}
.kpi .delta{font-size:12px;font-weight:600}
.up{color:var(--green)}.down{color:var(--red)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;background:var(--soft);color:var(--muted);white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);padding:6px 12px;border-radius:20px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}

/* Table */
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:600;padding:12px 16px;border-bottom:1px solid var(--line)}
td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer;transition:.1s}
tbody tr:hover{background:var(--soft)}
tbody tr:last-child td{border-bottom:0}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12.5px;color:#fff;flex:none}
.table-wrap{overflow-x:auto}

/* Kanban */
.board{display:grid;grid-template-columns:repeat(6,minmax(235px,1fr));gap:14px;overflow-x:auto;padding-bottom:10px}
.col{background:var(--soft);border-radius:var(--r);padding:12px;min-height:420px;display:flex;flex-direction:column;gap:10px;border:2px dashed transparent;transition:.15s}
.col.over{border-color:var(--brand);background:var(--brand-l)}
.col-h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;padding:2px 4px;white-space:nowrap}
.col-h .sum{margin-left:auto;font-weight:600;font-size:11.5px;color:var(--muted)}
.deal{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:grab;box-shadow:var(--shadow);transition:.15s}
.deal:hover{transform:translateY(-2px);border-color:var(--brand)}
.deal.dragging{opacity:.45}
.deal h4{font-size:13.5px;font-weight:700;margin-bottom:3px}
.deal .val{font-weight:800;font-size:15px;margin:8px 0 6px}
.deal .foot{display:flex;align-items:center;gap:6px;justify-content:space-between}
.mv{border:0;background:var(--soft);width:24px;height:24px;border-radius:6px;cursor:pointer;color:var(--muted)}
.mv:hover{background:var(--brand);color:#fff}

/* Products */
.prods{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.prod .img{height:150px;border-radius:12px 12px 0 0;display:grid;place-items:center;position:relative}
.prod .img .st{position:absolute;top:10px;right:10px}
.prod .card-b h4{font-size:14.5px;font-weight:700}
.price{font-size:19px;font-weight:800;letter-spacing:-.4px}

/* Lists */
.list-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.check{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;cursor:pointer;flex:none;background:var(--card)}
.check.on{background:var(--green);border-color:var(--green);color:#fff}
.done{text-decoration:line-through;color:var(--muted)}

/* AI */
.ai-hero{background:linear-gradient(135deg,#2A1D15,#5B3320 55%,#B8643A);color:#fff;border-radius:var(--r);padding:24px;position:relative;overflow:hidden}
.ai-hero:after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:radial-gradient(#ffffff30,transparent 70%)}
.ai-hero h2{font-size:22px;letter-spacing:-.5px;margin-bottom:6px}
.insight{display:flex;gap:12px;padding:14px;border-radius:12px;background:var(--soft);margin-bottom:10px;align-items:flex-start}
.insight .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;font-size:16px}
.insight b{display:block;font-size:13.5px;margin-bottom:2px}
textarea.msg{width:100%;min-height:150px;border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--soft);resize:vertical;outline:0;line-height:1.55}
textarea.msg:focus{border-color:var(--brand)}

/* Chart */
.bars{display:flex;align-items:flex-end;gap:14px;height:210px;padding-top:24px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.bar .b{width:100%;max-width:54px;border-radius:9px 9px 4px 4px;background:linear-gradient(180deg,#D98A5B,var(--brand));position:relative;transition:height .6s cubic-bezier(.2,.8,.2,1);min-height:4px}
.bar.cur .b{background:linear-gradient(180deg,#3B342E,#1E1B18)}
[data-theme="dark"] .bar.cur .b{background:linear-gradient(180deg,#F2EEEA,#BDB4AB)}
.bar .b span{position:absolute;top:-21px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;white-space:nowrap}
.bar small{color:var(--muted);font-size:11.5px;font-weight:600;text-transform:capitalize}
.funnel-row{margin-bottom:12px}
.funnel-row .track{height:10px;border-radius:6px;background:var(--soft);overflow:hidden;margin-top:6px}
.funnel-row .fill{height:100%;border-radius:6px}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(20,17,15,.45);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:100;padding:20px;animation:fade .15s}
.modal{background:var(--card);border-radius:18px;width:min(620px,100%);max-height:90vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.3);animation:pop .2s cubic-bezier(.2,.8,.2,1)}
.modal.wide{width:min(820px,100%)}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:20px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:1}
.modal-h h2{font-size:17px}
.modal-b{padding:20px 22px}
.modal-f{display:flex;gap:10px;justify-content:flex-end;padding:16px 22px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--card)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card);outline:0;transition:.15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-l)}
.field textarea{min-height:80px;resize:vertical}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:12px 18px;border-radius:12px;font-weight:600;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:pop .2s}
.menu{position:absolute;right:0;top:44px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.15);padding:6px;min-width:190px;z-index:30}
.menu button{display:flex;gap:10px;align-items:center;width:100%;padding:9px 12px;border:0;background:none;border-radius:8px;cursor:pointer;text-align:left;font-weight:500}
.menu button:hover{background:var(--soft)}
.empty{text-align:center;padding:40px;color:var(--muted)}
.stat-mini{background:var(--soft);border-radius:12px;padding:12px 14px}
.stat-mini b{display:block;font-size:17px}
.timeline{border-left:2px solid var(--line);margin-left:6px;padding-left:16px}
.timeline .t{position:relative;padding-bottom:12px}
.timeline .t:before{content:"";position:absolute;left:-22px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--brand)}
.mobile-nav{display:none}
.login{position:fixed;inset:0;z-index:500;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 10%,#5B3320,#1B1917 60%)}
.login .box{background:var(--card);width:min(400px,100%);border-radius:20px;padding:32px 28px;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.login .mark{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#D98A5B,var(--brand-d));display:grid;place-items:center;margin-bottom:16px}
.login h2{font-size:21px;letter-spacing:-.4px}
.login .field{margin-top:14px}
.login .err{color:var(--red);font-size:12.5px;margin-top:12px;min-height:16px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;margin-top:4px}
.sync .dot{width:7px;height:7px}

@media (max-width:1200px){.kpis{grid-template-columns:repeat(3,1fr)}.g2,.g3{grid-template-columns:1fr}}
@media (max-width:820px){
  #demoTag{bottom:auto;top:10px;right:auto;left:50%;transform:translateX(-50%)}
  .side{display:none}.main{margin-left:0}
  .top{padding:14px 16px}.content{padding:16px 16px 100px}
  .search{display:none}.kpis{grid-template-columns:1fr 1fr}
  .form{grid-template-columns:1fr}
  .board{grid-template-columns:repeat(6,82vw);scroll-snap-type:x mandatory}.col{scroll-snap-align:start}
  .mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--side);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:50;justify-content:space-around}
  .mobile-nav button{background:none;border:0;color:var(--side-ink);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;padding:4px 6px;border-radius:8px}
  .mobile-nav button.active{color:#fff;background:var(--brand)}
  .mobile-nav svg{width:20px;height:20px}
  .hide-m{display:none}
}
</style>
</head>
<body>
<div style="position:fixed;bottom:14px;right:14px;z-index:60;background:#1B1917;color:#fff;font-size:12px;padding:8px 12px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25)" id="demoTag">👀 Demonstração · dados fictícios</div>
<div class="app">
  <aside class="side">
    <div class="logo"><div class="mark">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M4 11V8a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v3"/><path d="M2 13a2 2 0 0 1 4 0v2h12v-2a2 2 0 0 1 4 0v4a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1z"/><path d="M5 18v2M19 18v2"/></svg>
    </div><div>SofáCRM<small>Gestão inteligente</small></div></div>
    <div id="navList"></div>
    <div class="spacer"></div>
    <div class="store"><b id="storeName">Minha Loja</b><span id="storeInfo">Dados salvos neste navegador</span></div>
  </aside>

  <main class="main">
    <header class="top">
      <div><h1 id="pageTitle">Painel</h1><div class="sub" id="pageSub"></div></div>
      <div class="grow"></div>
      <div class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="globalSearch" placeholder="Buscar cliente, pedido..." autocomplete="off"></div>
      <button class="icon-btn" title="Tema claro/escuro" onclick="toggleTheme()"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
      <div style="position:relative">
        <button class="btn primary" onclick="toggleQuick(event)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg><span class="hide-m">Novo</span></button>
        <div id="quickMenu" class="menu" style="display:none">
          <button onclick="formClient()">👤 Cliente</button>
          <button onclick="formDeal()">🎯 Oportunidade</button>
          <button onclick="formOrder()">🧾 Pedido</button>
          <button onclick="formTask()">✅ Tarefa</button>
          <button onclick="formProduct()">🛋️ Produto</button>
        </div>
      </div>
    </header>
    <section class="content" id="view"></section>
  </main>
</div>
<nav class="mobile-nav" id="mobileNav"></nav>
<div id="modalRoot"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============ ÍCONES ============ */
const I = {
  painel:'<path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z"/>',
  funil:'<path d="M3 4h18l-7 8v6l-4 2v-8z"/>',
  clientes:'<circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M16 3.5a4 4 0 0 1 0 9M22 21a7 7 0 0 0-4-6.3"/>',
  pedidos:'<path d="M6 2h12v20l-3-2-3 2-3-2-3 2zM9 7h6M9 11h6M9 15h4"/>',
  produtos:'<path d="M4 11V8a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v3"/><path d="M2 13a2 2 0 0 1 4 0v2h12v-2a2 2 0 0 1 4 0v4a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1z"/>',
  tarefas:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M9 16l2 2 4-4"/>',
  ia:'<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9zM19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9z"/>',
  config:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.8 1.2V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-2.8-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3.2 14H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.2-2.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 10 3.2V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.8 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0 1.2 2.8H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1.1z"/>'
};
const svg = (k,s=18) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[k]}</svg>`;

/* ============ CONSTANTES ============ */
const STAGES = [
  {id:'novo',nome:'Novo lead',prob:.1,cor:'#3C6FD1'},
  {id:'contato',nome:'Em contato',prob:.25,cor:'#7B61D1'},
  {id:'orcamento',nome:'Orçamento enviado',prob:.5,cor:'#D99A2B'},
  {id:'negociacao',nome:'Negociação',prob:.75,cor:'#B8643A'},
  {id:'ganho',nome:'Fechado ✓',prob:1,cor:'#2E9E6A'},
  {id:'perdido',nome:'Perdido',prob:0,cor:'#9A928A'}
];
const ORDER_ST = [
  {id:'pagamento',nome:'Aguardando pagamento',cor:'#D99A2B'},
  {id:'producao',nome:'Em produção',cor:'#7B61D1'},
  {id:'pronto',nome:'Pronto p/ entrega',cor:'#3C6FD1'},
  {id:'rota',nome:'Em rota',cor:'#B8643A'},
  {id:'entregue',nome:'Entregue',cor:'#2E9E6A'},
  {id:'cancelado',nome:'Cancelado',cor:'#9A928A'}
];
const ORIGENS = ['Instagram','WhatsApp','Loja física','Indicação','Facebook','Google','Site'];
const PAGTOS = ['Pix','Cartão de crédito','Cartão de débito','Boleto','Dinheiro','Crediário'];

const AV_COLORS = ['#B8643A','#3C6FD1','#2E9E6A','#7B61D1','#D99A2B','#C2477A','#2A8C9A','#5B6472'];

let sb = null, session = null, synced = {}, syncTimer = null, syncState = 'ok', pendingRender = false;
function emptyDB(){ return {config:{loja:CFG.nomeLoja||'Minha Loja',meta:30000},products:[],clients:[],orders:[],deals:[],tasks:[]}; }
function recordsOf(d){
  const out = {};
  COLS.forEach(t => (d[t]||[]).forEach(r => out[t+':'+r.id] = {tipo:t, dados:r}));
  out['config:main'] = {tipo:'config', dados:{loja:d.config.loja, meta:d.config.meta}};
  return out;
}
function queueSync(){ clearTimeout(syncTimer); setSync('saving'); syncTimer = setTimeout(pushChanges, 350); }
async function pushChanges(){
  const cur = recordsOf(db), up = [], del = [];
  for(const [k,v] of Object.entries(cur)){ if(synced[k] !== JSON.stringify(v.dados)) up.push({id:k, tipo:v.tipo, dados:v.dados, atualizado_por:session.user.email}); }
  for(const k of Object.keys(synced)) if(!cur[k]) del.push(k);
  if(!up.length && !del.length) return setSync('ok');
  try{
    for(let i=0;i<up.length;i+=500){ const part = up.slice(i,i+500); const {error} = await sb.from('registros').upsert(part); if(error) throw error; part.forEach(r => synced[r.id] = JSON.stringify(r.dados)); }
    for(let i=0;i<del.length;i+=200){ const part = del.slice(i,i+200); const {error} = await sb.from('registros').delete().in('id', part); if(error) throw error; part.forEach(k => delete synced[k]); }
    setSync('ok');
  }catch(e){ setSync('erro'); toast('⚠️ Não foi possível salvar na nuvem. Verifique a internet.'); setTimeout(()=>{ if(syncState==='erro') queueSync(); }, 8000); }
}
async function pullAll(){
  const rows = [];
  for(let from=0;;from+=1000){
    const {data, error} = await sb.from('registros').select('id,tipo,dados').order('id').range(from, from+999);
    if(error) throw error; rows.push(...data); if(data.length < 1000) break;
  }
  const d = emptyDB(); synced = {};
  rows.forEach(r => { synced[r.id] = JSON.stringify(r.dados); if(r.tipo==='config') Object.assign(d.config, r.dados); else if(d[r.tipo]) d[r.tipo].push(r.dados); });
  return d;
}
function applyRemote(p){
  if(p.eventType === 'DELETE'){
    const k = p.old?.id; if(!k || !(k in synced)) return;
    delete synced[k]; const [t,id] = [k.slice(0,k.indexOf(':')), k.slice(k.indexOf(':')+1)];
    if(db[t]) db[t] = db[t].filter(r => r.id !== id);
  } else {
    const r = p.new; if(!r?.id) return; const j = JSON.stringify(r.dados);
    if(synced[r.id] === j) return; synced[r.id] = j;
    if(r.tipo === 'config') Object.assign(db.config, r.dados);
    else if(db[r.tipo]){ const i = db[r.tipo].findIndex(x => x.id === r.dados.id); if(i>=0) db[r.tipo][i] = r.dados; else db[r.tipo].push(r.dados); }
  }
  softRender();
}
function softRender(){
  const a = document.activeElement;
  if($('#modalRoot').innerHTML || (a && $('#view').contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName))) pendingRender = true; else render();
}

async function enterCloud(){
  $('#view').innerHTML = '<div class="empty">Carregando dados com segurança...</div>';
  try{
    const {data:ok, error:e1} = await sb.rpc('is_membro'); if(e1) throw e1;
    if(!ok){ await sb.auth.signOut(); session = null; return loginScreen('login','Este e-mail não tem acesso. Peça ao administrador para liberar.'); }
    db = await pullAll();
  }catch(e){ $('#view').innerHTML = `<div class="empty">⚠️ Não foi possível conectar ao banco de dados.<br><span class="small">${esc(e.message||e)}</span><br><br><button class="btn" onclick="enterCloud()">Tentar de novo</button></div>`; return; }
  sb.removeAllChannels();
  sb.channel('registros').on('postgres_changes', {event:'*', schema:'public', table:'registros'}, applyRemote).subscribe();
  render(); setSync('ok');
}

/* ============ MÉTRICAS ============ */
const validOrders = () => db.orders.filter(o=>o.status!=='cancelado');
function monthKey(s){ return s.slice(0,7); }
function revenueByMonth(n=6){
  const out=[]; const d=new Date(); d.setDate(1);
  for(let i=n-1;i>=0;i--){
    const m=new Date(d.getFullYear(), d.getMonth()-i, 1); const k=iso(m).slice(0,7);
    out.push({k, label:m.toLocaleDateString('pt-BR',{month:'short'}).replace('.',''), v:validOrders().filter(o=>monthKey(o.data)===k).reduce((a,o)=>a+o.total,0)});
  }
  return out;
}
function clientStats(id){
  const os = validOrders().filter(o=>o.clienteId===id);
  const last = os.map(o=>o.data).sort().pop();
  return {pedidos:os.length,total:os.reduce((a,o)=>a+o.total,0),ultima:last};
}
function dealScore(d){
  const c = C(d.clienteId); const parado = daysFrom(d.atualizado);
  let s = stage(d.etapa).prob*50 + Math.min(d.valor/250,22) + (['Indicação','Loja física'].includes(c?.origem)?12:6) - Math.min(parado*3,30);
  if(clientStats(d.clienteId).pedidos) s += 10;
  return s>=55?{t:'Quente',e:'🔥',c:'#D2543F'}:s>=32?{t:'Morno',e:'🌤️',c:'#D99A2B'}:{t:'Frio',e:'❄️',c:'#3C6FD1'};
}

function bindKanban(){
  document.querySelectorAll('.deal').forEach(el=>{
    el.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',el.dataset.id);el.classList.add('dragging');});
    el.addEventListener('dragend',()=>el.classList.remove('dragging'));
  });
  document.querySelectorAll('.col').forEach(col=>{
    col.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('over');});
    col.addEventListener('dragleave',()=>col.classList.remove('over'));
    col.addEventListener('drop',e=>{e.preventDefault();col.classList.remove('over');moveDeal(e.dataTransfer.getData('text/plain'),col.dataset.stage);});
  });
}
function moveDeal(id, etapa){

}
function dealToOrder(id){
  const d = db.deals.find(x=>x.id===id); const p = P(d.produtoId);

function insights(){
  const out = [];
  const abertos = db.deals.filter(d=>!['ganho','perdido'].includes(d.etapa));
  const parados = abertos.filter(d=>daysFrom(d.atualizado)>=5);
  if(parados.length) out.push({ic:'⏳',cor:'#D99A2B',t:`${parados.length} negociação(ões) parada(s) há 5+ dias`,d:`${parados.slice(0,3).map(d=>firstName(C(d.clienteId)?.nome)).join(', ')} — ${brl(parados.reduce((a,d)=>a+d.valor,0))} em risco. Mande um follow-up hoje.`,a:`go('ia');setTimeout(()=>pickMsg('${parados[0].clienteId}','followup'),50)`,al:'Gerar follow-up'});
  const atr = db.tasks.filter(t=>!t.feito && t.data<TODAY());
  if(atr.length) out.push({ic:'⚠️',cor:'#D2543F',t:`${atr.length} tarefa(s) atrasada(s)`,d:atr.slice(0,2).map(t=>t.titulo).join(' · '),a:"go('tarefas')",al:'Ver agenda'});
  const hot = abertos.filter(d=>dealScore(d).t==='Quente');
  if(hot.length) out.push({ic:'🔥',cor:'#D2543F',t:`${hot.length} lead(s) quente(s) prontos para fechar`,d:hot.slice(0,3).map(d=>`${firstName(C(d.clienteId)?.nome)} (${brlK(d.valor)})`).join(', ')+'. Priorize esses contatos!',a:"go('funil')",al:'Abrir funil'});
  const low = db.products.filter(p=>p.estoque<=2);
  if(low.length) out.push({ic:'📦',cor:'#7B61D1',t:`Estoque baixo em ${low.length} produto(s)`,d:low.map(p=>`${p.nome} (${p.estoque})`).join(', ')+'. Faça reposição com o fornecedor.',a:"go('produtos')",al:'Ver produtos'});
  const ent = db.orders.filter(o=>['pronto','rota','producao'].includes(o.status) && o.entrega>=TODAY() && daysFrom(o.entrega)>=-3);
  if(ent.length) out.push({ic:'🚚',cor:'#3C6FD1',t:`${ent.length} entrega(s) nos próximos 3 dias`,d:ent.map(o=>`#${o.num} ${firstName(C(o.clienteId)?.nome)}`).join(', ')+'. Confirme endereço e horário.',a:`go('ia');setTimeout(()=>pickMsg('${ent[0].clienteId}','entrega'),50)`,al:'Avisar cliente'});
  const atrasados = db.orders.filter(o=>!['entregue','cancelado'].includes(o.status) && o.entrega<TODAY());
  if(atrasados.length) out.push({ic:'🕒',cor:'#D2543F',t:`${atrasados.length} pedido(s) com entrega atrasada`,d:atrasados.slice(0,3).map(o=>`#${o.num}`).join(', ')+' — atualize o status ou avise o cliente.',a:"state.orderFilter='todos';go('pedidos')",al:'Ver pedidos'});
  const inat = db.clients.filter(c=>{const s=clientStats(c.id);return s.ultima && daysFrom(s.ultima)>90;});
  if(inat.length) out.push({ic:'💤',cor:'#5B6472',t:`${inat.length} cliente(s) sem comprar há 90+ dias`,d:'Ótima hora para oferecer puff, almofadas ou impermeabilização. Campanha de reativação sugerida.',a:`go('ia');setTimeout(()=>pickMsg('${inat[0].id}','reativacao'),50)`,al:'Criar mensagem'});
  const orig = {}; db.deals.forEach(d=>{const o=C(d.clienteId)?.origem||'—';orig[o]=orig[o]||{g:0,t:0};orig[o].t++;if(d.etapa==='ganho')orig[o].g++;});
  validOrders().forEach(o=>{const og=C(o.clienteId)?.origem; if(og){orig[og]=orig[og]||{g:0,t:0}; orig[og].v=(orig[og].v||0)+o.total;}});
  const best = Object.entries(orig).filter(([,v])=>v.v).sort((a,b)=>b[1].v-a[1].v)[0];

function openForm({title, fields, values={}, onSave, onDelete, extra=''}){
  const f = fields.map(x=>{
    const v = values[x.k] ?? x.def ?? '';
    let inp;
    if(x.t==='select') inp = `<select name="${x.k}" ${x.req?'required':''}>${x.opts.map(o=>{const [ov,ol]=Array.isArray(o)?o:[o,o];return `<option value="${esc(ov)}" ${String(ov)===String(v)?'selected':''}>${esc(ol)}</option>`;}).join('')}</select>`;
    else if(x.t==='textarea') inp = `<textarea name="${x.k}">${esc(v)}</textarea>`;
    else inp = `<input name="${x.k}" type="${x.t||'text'}" value="${esc(v)}" ${x.req?'required':''} ${x.t==='number'?'step="any" min="0"':''} placeholder="${esc(x.ph||'')}">`;
    return `<div class="field ${x.full?'full':''}"><label>${x.l}${x.req?' *':''}</label>${inp}</div>`;
  }).join('');
  modal(`<form class="modal" id="theForm"><div class="modal-h"><h2>${title}</h2><button type="button" class="icon-btn" onclick="closeModal()">✕</button></div>
    <div class="modal-b"><div class="form">${f}</div>${extra}</div>
    <div class="modal-f">${onDelete?'<button type="button" class="btn danger" id="delBtn" style="margin-right:auto">Excluir</button>':''}<button type="button" class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary">Salvar</button></div></form>`);
  const form = $('#theForm');
  form.onsubmit = e => { e.preventDefault(); const data = Object.fromEntries(new FormData(form)); fields.forEach(x=>{ if(x.t==='number') data[x.k]=+data[x.k]||0; }); onSave(data); closeModal(); save(); render(); };
  if(onDelete) $('#delBtn').onclick = () => { askConfirm('Tem certeza que deseja excluir? Essa ação não pode ser desfeita.',()=>{ onDelete(); save(); render(); toast('Excluído'); }) };
  form.querySelector('input,select')?.focus();
  return form;
}

    onSave: x => {
      x.qtd = Math.max(1,x.qtd); x.total = Math.max(0, x.preco*x.qtd - x.desconto);
      if(o){ const p0=P(o.produtoId); if(p0 && o.status!=='cancelado') p0.estoque+=o.qtd; Object.assign(o,x); const p1=P(o.produtoId); if(p1 && o.status!=='cancelado') p1.estoque=Math.max(0,p1.estoque-o.qtd); toast('Pedido atualizado ✓'); }
      else { const num=Math.max(1000,...db.orders.map(z=>+z.num||0))+1; const no={id:uid(),num,...x}; db.orders.push(no); const p=P(x.produtoId); if(p && x.status!=='cancelado') p.estoque=Math.max(0,p.estoque-x.qtd);
        if(pre._deal){ const dd=db.deals.find(z=>z.id===pre._deal); if(dd) dd.pedidoId=no.id; }
        db.tasks.push({id:uid(),titulo:`Pós-venda pedido #${no.num}`,clienteId:x.clienteId,tipo:'Pós-venda',data:addDays(7,parseD(x.entrega||TODAY())),feito:false});
        toast(`Pedido #${no.num} criado ✓ · Pós-venda agendado`); }
    },
    onDelete: o ? () => { const p=P(o.produtoId); if(p && o.status!=='cancelado') p.estoque+=o.qtd; db.orders = db.orders.filter(x=>x.id!==id); } : null
  });
  const g = n => form.querySelector(`[name=${n}]`);
  const upd = () => $('#oTotal').textContent = brl(Math.max(0,(+g('preco').value)*(Math.max(1,+g('qtd').value)) - (+g('desconto').value)));
  ['preco','qtd','desconto'].forEach(n=>g(n).oninput=upd);
  g('produtoId').onchange = () => { g('preco').value = P(g('produtoId').value)?.preco||0; upd(); };
  upd();
}
function formTask(id, pre={}){
  closeQuick(); const t = id ? db.tasks.find(x=>x.id===id) : null;
  openForm({title: t?'Editar tarefa':'Nova tarefa', values: t||{data:TODAY(),...pre},
    fields:[{k:'titulo',l:'O que fazer',req:1,full:1,ph:'Ex: Ligar para confirmar medidas'},{k:'tipo',l:'Tipo',t:'select',opts:TIPOS_TAREFA},{k:'data',l:'Quando',t:'date',req:1},
      {k:'clienteId',l:'Cliente (opcional)',t:'select',opts:[['','— Nenhum —'],...clientOpts()],full:1}],
    onSave: x => { if(t) Object.assign(t,x); else db.tasks.push({id:uid(),...x,feito:false}); toast('Tarefa salva ✓'); },
    onDelete: t ? () => { db.tasks = db.tasks.filter(x=>x.id!==id); } : null
  });
}
const HEXES = [['#5B5F66','Cinza Grafite'],['#A8622E','Caramelo'],['#C9B79C','Bege'],['#235E6F','Azul Petróleo'],['#E4DED3','Off-white'],['#6E7A4A','Verde Oliva'],['#C98B8B','Rosê'],['#2B2B2B','Preto'],['#7A2E2E','Vinho'],['#8C7B6B','Fendi'],['#3E4A7A','Azul Marinho'],['#D4A84B','Mostarda']];
function formProduct(id){
  closeQuick(); const p = id ? P(id) : null;
  openForm({title: p?'Editar produto':'Novo produto', values: p||{hex:'#5B5F66',estoque:1},
    fields:[{k:'nome',l:'Nome do modelo',req:1,full:1},{k:'categoria',l:'Categoria',t:'select',opts:['Retrátil','Canto','Sofá-cama','Clássico','Modular','Poltrona','Puff','Outro']},
      {k:'tecido',l:'Tecido',t:'select',opts:['Suede','Linho','Veludo','Bouclê','Couro','Couro sintético','Chenille','Algodão']},
      {k:'cor',l:'Nome da cor',req:1},{k:'hex',l:'Tom (visual)',t:'select',opts:HEXES},
      {k:'preco',l:'Preço de venda (R$)',t:'number',req:1},{k:'custo',l:'Custo (R$)',t:'number'},{k:'estoque',l:'Estoque (un.)',t:'number'}],
    onSave: x => { if(p) Object.assign(p,x); else db.products.push({id:uid(),...x}); toast('Produto salvo ✓'); },
    onDelete: p ? () => { db.products = db.products.filter(x=>x.id!==id); } : null
  });
}

/* ============ IMPRESSÃO ============ */
function printOrder(id){
  const o=db.orders.find(x=>x.id===id), c=C(o.clienteId), p=P(o.produtoId);
  const w=window.open('','_blank'); if(!w) return toast('Permita pop-ups para imprimir');
  w.document.write(`<html><head><title>Pedido #${o.num}</title><style>body{font-family:Inter,Arial;padding:40px;color:#1E1B18}h1{margin:0}table{width:100%;border-collapse:collapse;margin:24px 0}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:left}.r{text-align:right}.tot{font-size:22px;font-weight:800}</style></head><body>
  <div style="display:flex;justify-content:space-between;align-items:flex-start"><div><h1>${esc(db.config.loja)}</h1><p style="color:#777">Pedido de venda</p></div><div style="text-align:right"><h2 style="margin:0">#${o.num}</h2><p>${fmtDL(o.data)}</p></div></div>
  <p><b>Cliente:</b> ${esc(c?.nome)}<br><b>Telefone:</b> ${esc(c?.tel)}<br><b>Endereço:</b> ${esc(c?.bairro||'')}</p>
  <table><tr><th>Produto</th><th>Qtd</th><th class="r">Unitário</th><th class="r">Subtotal</th></tr><tr><td>${esc(p?.nome)} — ${esc(p?.tecido)} ${esc(p?.cor)}</td><td>${o.qtd}</td><td class="r">${brl(o.preco)}</td><td class="r">${brl(o.preco*o.qtd)}</td></tr>
  ${o.desconto?`<tr><td colspan="3" class="r">Desconto</td><td class="r">- ${brl(o.desconto)}</td></tr>`:''}<tr><td colspan="3" class="r"><b>Total</b></td><td class="r tot">${brl(o.total)}</td></tr></table>
  <p><b>Pagamento:</b> ${esc(o.pagamento)} · <b>Previsão de entrega:</b> ${fmtDL(o.entrega)}</p>${o.obs?`<p><b>Obs:</b> ${esc(o.obs)}</p>`:''}
  <p style="margin-top:60px;border-top:1px solid #000;width:280px;padding-top:6px">Assinatura do cliente</p><script>window.print()<\/script></body></html>`);
  w.document.close();
}

/* ============ EXPORT / IMPORT ============ */
function download(name, content, type){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([content],{type})); a.download=name; a.click(); URL.revokeObjectURL(a.href); }
function exportJSON(){ download(`backup-sofacrm-${TODAY()}.json`, JSON.stringify(db,null,2), 'application/json'); toast('Backup baixado ✓'); }
function importJSON(file){ if(!file) return; const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d.clients||!d.orders) throw 0; db=d; save(); render(); toast('Backup restaurado ✓'); }catch(e){ toast('Arquivo inválido'); } }; r.readAsText(file); }
function exportCSV(){
  const rows=[['Nome','Telefone','Email','Bairro','Origem','Cadastro','Pedidos','Total gasto']];
  db.clients.forEach(c=>{const s=clientStats(c.id); rows.push([c.nome,c.tel,c.email,c.bairro,c.origem,c.criado,s.pedidos,s.total.toFixed(2).replace('.',',')]);});
  download(`clientes-${TODAY()}.csv`, '﻿'+rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(';')).join('\n'), 'text/csv'); toast('CSV exportado ✓');
}

/* ============ UI HELPERS ============ */
function askConfirm(msg,onYes){ modal(`<div class="modal" style="width:min(420px,100%)"><div class="modal-b" style="padding:26px 24px 8px"><h2 style="font-size:17px;margin-bottom:8px">Confirmar</h2><p class="muted">${esc(msg)}</p></div><div class="modal-f" style="border:0"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" id="yesBtn" style="background:var(--red);border-color:var(--red)">Sim, confirmar</button></div></div>`); $('#yesBtn').onclick=()=>{closeModal();onYes();}; }
function modal(html){ $('#modalRoot').innerHTML = `<div class="overlay" onmousedown="if(event.target===this)closeModal()">${html}</div>`; }
function closeModal(){ $('#modalRoot').innerHTML=''; if(pendingRender){ pendingRender=false; render(); } }
let tt; function toast(m){ document.querySelector('.toast')?.remove(); const d=document.createElement('div'); d.className='toast'; d.textContent=m; document.body.appendChild(d); clearTimeout(tt); tt=setTimeout(()=>d.remove(),2600); }
function toggleQuick(e){ e.stopPropagation(); const m=$('#quickMenu'); m.style.display=m.style.display==='none'?'block':'none'; }
function closeQuick(){ $('#quickMenu').style.display='none'; }
function toggleTheme(){ const t = document.documentElement.dataset.theme==='dark'?'light':'dark'; document.documentElement.dataset.theme=t; try{localStorage.setItem('sofacrm_tema',t);}catch(e){} }
function confetti(){
  const cols=['#B8643A','#2E9E6A','#D99A2B','#3C6FD1','#C2477A'];
  for(let i=0;i<60;i++){ const s=document.createElement('div'); const x=Math.random()*100;
    s.style.cssText=`position:fixed;top:-10px;left:${x}vw;width:8px;height:12px;background:${cols[i%5]};z-index:300;border-radius:2px;pointer-events:none`;
    document.body.appendChild(s);
    s.animate([{transform:'translateY(0) rotate(0)',opacity:1},{transform:`translateY(${90+Math.random()*20}vh) translateX(${(Math.random()-.5)*200}px) rotate(${Math.random()*720}deg)`,opacity:0}],{duration:1600+Math.random()*1200,easing:'cubic-bezier(.2,.6,.4,1)'}).onfinish=()=>s.remove(); }
}
document.addEventListener('click', closeQuick);
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });
window.addEventListener('hashchange', ()=>{ const v=location.hash.slice(1); if(v!==state.view && VIEWS.find(x=>x.id===v)){ state.view=v; render(); } });
$('#globalSearch').addEventListener('input', e=>{
  state.q = e.target.value;
  if(['painel','ia','tarefas','config'].includes(state.view) && state.q){ state.view='clientes'; location.hash='clientes'; }
  const pos = e.target.selectionStart; render(); e.target.focus(); e.target.setSelectionRange(pos,pos);
});

try{ document.documentElement.dataset.theme = localStorage.getItem('sofacrm_tema') || 'light'; }catch(e){}
(async function boot(){
  if(!CLOUD){ db = load() || seed(); render(); return; }
  db = emptyDB(); renderNav();
  sb = supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey);
  const recovery = /type=(recovery|invite)/.test(location.hash);
  sb.auth.onAuthStateChange((ev, s) => { if(ev==='PASSWORD_RECOVERY'){ session = s; loginScreen('nova'); } });
  const {data:{session:s}} = await sb.auth.getSession();
  if(recovery && s){ session = s; return loginScreen('nova'); }
  if(!s) return loginScreen();
  session = s; enterCloud();
})();
</script>
